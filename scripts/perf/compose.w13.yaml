# W13 performance environment override.
#
# Usage:
#   docker compose -f compose.yaml -f scripts/perf/compose.w13.yaml config
#   docker compose -f compose.yaml -f scripts/perf/compose.w13.yaml up -d --build --wait postgres rabbitmq driver
#
# This file is the ONLY supported way to run the W13 experiments. It:
#   - isolates the environment in the `ride-hailing-w13` compose project;
#   - moves every published host port away from the development stack;
#   - removes the Matching host port so replicas can be scaled without a
#     bind-address collision;
#   - pins CPU/memory limits and the PostgreSQL pool size so configured
#     variables can be recorded in every run manifest.
#
# It does not change service code or production behavior.
name: ride-hailing-w13

services:
  otel-collector:
    ports: !override []
    cpus: 0.5
    mem_limit: 256m

  prometheus:
    ports: !override ["127.0.0.1:${W13_PROMETHEUS_PORT:-19090}:9090"]
    cpus: 0.5
    mem_limit: 512m

  jaeger:
    ports: !override ["127.0.0.1:${W13_JAEGER_PORT:-26686}:16686"]
    cpus: 0.5
    mem_limit: 512m

  postgres:
    ports: !override ["127.0.0.1:${W13_POSTGRES_PORT:-15432}:5432"]
    cpus: ${W13_POSTGRES_CPUS:-2.0}
    mem_limit: ${W13_POSTGRES_MEM:-2g}

  redis:
    ports: !override ["127.0.0.1:${W13_REDIS_PORT:-16379}:6379"]
    cpus: ${W13_REDIS_CPUS:-1.0}
    mem_limit: ${W13_REDIS_MEM:-512m}

  rabbitmq:
    ports: !override [
      "127.0.0.1:${W13_RABBIT_PORT:-15673}:5672",
      "127.0.0.1:${W13_RABBIT_MGMT_PORT:-25672}:15672"
    ]
    cpus: ${W13_RABBIT_CPUS:-2.0}
    mem_limit: ${W13_RABBIT_MEM:-1g}

  gateway:
    ports: !override ["127.0.0.1:${W13_GATEWAY_PORT:-18080}:8080"]
    cpus: ${W13_GATEWAY_CPUS:-1.0}
    mem_limit: ${W13_GATEWAY_MEM:-512m}

  identity:
    ports: !override ["127.0.0.1:${W13_IDENTITY_PORT:-18101}:8080"]
    cpus: ${W13_IDENTITY_CPUS:-0.5}
    mem_limit: ${W13_IDENTITY_MEM:-256m}

  driver:
    ports: !override ["127.0.0.1:${W13_DRIVER_PORT:-18102}:8080"]
    cpus: ${W13_DRIVER_CPUS:-2.0}
    mem_limit: ${W13_DRIVER_MEM:-1g}
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Database=driver_db;Username=driver_app;Password=${DRIVER_DB_PASSWORD:-driver_dev_pw};Maximum Pool Size=${W13_DB_POOL:-20}"

  # No host port: E03 scales this service with `--scale matching=N`.
  matching:
    ports: !override []
    cpus: ${W13_MATCHING_CPUS:-2.0}
    mem_limit: ${W13_MATCHING_MEM:-1g}
    environment:
      ServiceInstanceId: !reset null
      ConnectionStrings__Postgres: "Host=postgres;Database=matching_db;Username=matching_app;Password=${MATCHING_DB_PASSWORD:-matching_dev_pw};Maximum Pool Size=${W13_DB_POOL:-20}"
      Matching__Worker__Enabled: "${W13_MATCHING_WORKER_ENABLED:-true}"
      Matching__Worker__MaxConcurrentRounds: "${W13_MATCHING_MAX_CONCURRENT_ROUNDS:-4}"
      Matching__Worker__BatchSize: "${W13_MATCHING_WORKER_BATCH_SIZE:-16}"
      RabbitMq__Prefetch: "${W13_RABBIT_PREFETCH:-16}"

  trip:
    ports: !override ["127.0.0.1:${W13_TRIP_PORT:-18103}:8080"]
    cpus: ${W13_TRIP_CPUS:-2.0}
    mem_limit: ${W13_TRIP_MEM:-1g}
    environment:
      # E02 targets the canonical POST /trips surface; the durable
      # RideRequested intent must be written in the same call.
      TripMessaging__Enabled: "true"
      ConnectionStrings__Postgres: "Host=postgres;Database=trip_db;Username=trip_app;Password=${TRIP_DB_PASSWORD:-trip_dev_pw};Maximum Pool Size=${W13_DB_POOL:-20}"

  payment:
    ports: !override ["127.0.0.1:${W13_PAYMENT_PORT:-18105}:8080"]
    cpus: ${W13_PAYMENT_CPUS:-1.0}
    mem_limit: ${W13_PAYMENT_MEM:-512m}

  notification:
    ports: !override []
    cpus: ${W13_NOTIFICATION_CPUS:-1.0}
    mem_limit: ${W13_NOTIFICATION_MEM:-512m}
