name: ci
on:
  push:
    branches: [main, 'MemC-*-Distributed']
  # Run for every pull request, not only a hard-coded list of stacked bases.
  # A new stacked branch must never silently skip CI just because its base was
  # not added to a YAML allow-list.
  pull_request:
  workflow_dispatch:
jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_BEFORE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: scripts/test/hygiene-check.sh --self-test
      - run: scripts/test/verify-source-anchor.test.sh
      - run: scripts/test/hygiene-check.sh
  build-test:
    name: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore RideHailing.Distributed.slnx
      - run: dotnet build RideHailing.Distributed.slnx -c Release --no-restore
      - run: dotnet test RideHailing.Distributed.slnx -c Release --no-build --logger trx --results-directory TestResults
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults
  compose-config:
    name: compose-config
    runs-on: ubuntu-latest
    env:
      # Deliberately non-development values: the release overlay must render
      # with operator-supplied secrets and must never inherit *_dev_pw.
      POSTGRES_PASSWORD: ci-release-postgres-pw
      IDENTITY_DB_PASSWORD: ci-release-identity-pw
      DRIVER_DB_PASSWORD: ci-release-driver-pw
      TRIP_DB_PASSWORD: ci-release-trip-pw
      MATCHING_DB_PASSWORD: ci-release-matching-pw
      PAYMENT_DB_PASSWORD: ci-release-payment-pw
      NOTIFICATION_DB_PASSWORD: ci-release-notification-pw
      RABBITMQ_PASSWORD: ci-release-rabbitmq-pw
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      - run: docker compose -f compose.yaml -f deploy/compose/compose.release.yaml config
      - name: release overlay fails closed without secrets
        run: |
          unset POSTGRES_PASSWORD IDENTITY_DB_PASSWORD DRIVER_DB_PASSWORD \
            TRIP_DB_PASSWORD MATCHING_DB_PASSWORD PAYMENT_DB_PASSWORD \
            NOTIFICATION_DB_PASSWORD RABBITMQ_PASSWORD
          if docker compose --env-file /dev/null \
              -f compose.yaml -f deploy/compose/compose.release.yaml config \
              --quiet > /dev/null 2> release-missing-secrets.log; then
            echo 'release overlay accepted a render without required secrets'
            cat release-missing-secrets.log
            exit 1
          fi
          grep -q 'POSTGRES_PASSWORD' release-missing-secrets.log
      - run: docker compose -f compose.yaml -f deploy/compose/compose.ha.yaml --profile ha config
      - run: python3 scripts/security/scan-secrets.py
  platform-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: ride-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile obs up -d --build
      - run: python3 scripts/test/platform-smoke.py
      - run: python3 scripts/test/payment-smoke.py
      - run: python3 scripts/test/topology-smoke.py
      - if: always()
        run: docker compose --profile obs logs --no-color > platform-smoke.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: platform-smoke.log
      - if: always()
        run: docker compose --profile obs down -v
