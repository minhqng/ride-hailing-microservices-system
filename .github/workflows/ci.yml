name: ci
on:
  push:
    branches: [main, 'MemC-*-Distributed']
  # Run for every pull request, not only a hard-coded list of stacked bases.
  # A new stacked branch must never silently skip CI just because its base was
  # not added to a YAML allow-list.
  pull_request:
  workflow_dispatch:
jobs:
  fault-campaign:
    if: github.event_name == 'pull_request' && github.head_ref == 'integration/team-w11-final'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: bash scripts/fault/team-fault-campaign.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fault-campaign-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/team/fault-campaign/outputs/
            evidence/member-b/w11-fault-proofs/raw/
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_BEFORE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: scripts/test/hygiene-check.sh --self-test
      - run: scripts/test/verify-source-anchor.test.sh
      - run: scripts/test/hygiene-check.sh
  build-test:
    name: build-test
    runs-on: ubuntu-latest
    env:
      B12_AUDIT_OUTPUT_DIR: ${{ github.workspace }}/TestResults/b12-audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore RideHailing.Distributed.slnx
      - run: python3 -m unittest discover -s scripts/perf/tests -p 'test_*.py'
      - run: python3 -m compileall -q scripts/perf scripts/evidence scripts/fault
      - run: dotnet build RideHailing.Distributed.slnx -c Release --no-restore
      - run: python3 -m unittest discover -s scripts/test -p 'test_assert_trx.py'
      - run: dotnet test RideHailing.Distributed.slnx -c Release --no-build --logger trx --results-directory TestResults
      # Refuse an SDK/VSTest false green with missing or zero test discovery.
      - run: python3 scripts/test/assert-trx.py --results-dir TestResults --min-passed 1200 --min-files 12 --max-skipped 1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults
  compose-config:
    name: compose-config
    runs-on: ubuntu-latest
    env:
      # Deliberately non-development values: the release overlay must render
      # with operator-supplied secrets and must never inherit *_dev_pw.
      POSTGRES_PASSWORD: ci-release-postgres-pw
      IDENTITY_DB_PASSWORD: ci-release-identity-pw
      DRIVER_DB_PASSWORD: ci-release-driver-pw
      TRIP_DB_PASSWORD: ci-release-trip-pw
      MATCHING_DB_PASSWORD: ci-release-matching-pw
      PAYMENT_DB_PASSWORD: ci-release-payment-pw
      NOTIFICATION_DB_PASSWORD: ci-release-notification-pw
      RABBITMQ_PASSWORD: ci-release-rabbitmq-pw
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: python3 scripts/security/init-local-auth.py
      - run: docker compose -f compose.yaml -f deploy/compose/compose.release.yaml config --quiet
      - name: release overlay fails closed without secrets
        run: |
          unset POSTGRES_PASSWORD IDENTITY_DB_PASSWORD DRIVER_DB_PASSWORD \
            TRIP_DB_PASSWORD MATCHING_DB_PASSWORD PAYMENT_DB_PASSWORD \
            NOTIFICATION_DB_PASSWORD RABBITMQ_PASSWORD
          if docker compose --env-file /dev/null \
              -f compose.yaml -f deploy/compose/compose.release.yaml config \
              --quiet > /dev/null 2> release-missing-secrets.log; then
            echo 'release overlay accepted a render without required secrets'
            cat release-missing-secrets.log
            exit 1
          fi
          cat release-missing-secrets.log
          grep -q 'must be set for the release overlay' release-missing-secrets.log
      - run: docker compose -f compose.yaml -f deploy/compose/compose.ha.yaml --profile ha config --quiet
      - run: python3 scripts/security/scan-secrets.py
  platform-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: ride-ci-${{ github.run_id }}-${{ github.run_attempt }}
      TRIP_MESSAGING_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: python3 scripts/security/init-local-auth.py
      - run: docker compose --profile obs up -d --build
      - run: python3 scripts/test/platform-smoke.py
      - run: python3 scripts/test/security-gate.py --identity-tests
      - run: dotnet build scripts/test/w10-g3-harness/RideHailing.W10Harness.csproj -c Release
      - run: python3 scripts/test/core-runtime-gate.py
      - run: python3 scripts/evidence/runtime-observations.py --output plans/reports/runtime-observations.json
      - run: python3 scripts/test/payment-smoke.py
      - run: python3 scripts/test/topology-smoke.py
      - if: always()
        run: docker compose --profile obs logs --no-color > platform-smoke.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            platform-smoke.log
            plans/reports/security-gate.json
            plans/reports/identity-gate.log
            plans/reports/core-runtime-gate.json
            plans/reports/runtime-observations.json
            TestResults/identity-gate/
      - if: always()
        run: docker compose --profile obs down -v
