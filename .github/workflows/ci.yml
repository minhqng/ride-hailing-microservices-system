name: ci
on:
  push:
    branches: [main, 'MemC-*-Distributed']
  pull_request:
    branches: [main, 'MemC-*-Distributed']
jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore RideHailing.Distributed.slnx
      - run: dotnet build RideHailing.Distributed.slnx -c Release --no-restore
      - run: dotnet test RideHailing.Distributed.slnx -c Release --no-build --logger trx --results-directory TestResults
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults
  compose-config:
    name: compose-config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
  platform-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: ride-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile obs up -d --build
      - run: python3 scripts/test/platform-smoke.py
      - run: python3 scripts/test/payment-smoke.py
      - run: python3 scripts/test/topology-smoke.py
      - if: always()
        run: docker compose --profile obs logs --no-color > platform-smoke.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: platform-smoke.log
      - if: always()
        run: docker compose --profile obs down -v
