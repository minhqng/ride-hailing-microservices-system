name: ci
on:
  # Only main is a long-lived branch. Feature and integration branches are
  # validated through pull_request, so a push trigger list would only add
  # duplicate runs for branches that are already covered.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_BEFORE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: scripts/test/hygiene-check.sh --self-test
      - run: scripts/test/verify-source-anchor.test.sh
      - run: scripts/test/hygiene-check.sh
  build-test:
    name: build-test
    runs-on: ubuntu-latest
    env:
      INVARIANT_AUDIT_OUTPUT_DIR: ${{ github.workspace }}/TestResults/invariant-audit
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.100
      - run: dotnet restore RideHailing.Distributed.slnx
      - run: python3 -m compileall -q scripts/evidence scripts/security scripts/test
      - run: dotnet build RideHailing.Distributed.slnx -c Release --no-restore
      - run: python3 -m unittest discover -s scripts/test -p 'test_assert_trx.py'
      - run: dotnet test RideHailing.Distributed.slnx -c Release --no-build --logger trx --results-directory TestResults
      # Refuse an SDK/VSTest false green with missing, zero, or silently skipped discovery.
      - run: >-
          python3 scripts/test/assert-trx.py --results-dir TestResults
          --min-passed 1200 --min-files 13 --max-skipped 1
          --allowed-skip RideHailing.IdentityService.IntegrationTests.AuthNegativeTests.RejectedRequestsDoNotMutateAuthoritativeState
          --required-suites-file scripts/test/required-suites.txt
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults
  compose-config:
    name: compose-config
    runs-on: ubuntu-latest
    env:
      # Deliberately non-development values: the release overlay must render
      # with operator-supplied secrets and must never inherit *_dev_pw.
      POSTGRES_PASSWORD: ci-release-postgres-pw
      IDENTITY_DB_PASSWORD: ci-release-identity-pw
      DRIVER_DB_PASSWORD: ci-release-driver-pw
      TRIP_DB_PASSWORD: ci-release-trip-pw
      MATCHING_DB_PASSWORD: ci-release-matching-pw
      PAYMENT_DB_PASSWORD: ci-release-payment-pw
      NOTIFICATION_DB_PASSWORD: ci-release-notification-pw
      RABBITMQ_PASSWORD: ci-release-rabbitmq-pw
    steps:
      - uses: actions/checkout@v5
      - run: docker compose config --quiet
      - run: python3 scripts/security/init-local-auth.py
      - run: docker compose -f compose.yaml -f deploy/compose/compose.release.yaml config --quiet
      - name: release overlay fails closed without secrets
        run: |
          unset POSTGRES_PASSWORD IDENTITY_DB_PASSWORD DRIVER_DB_PASSWORD \
            TRIP_DB_PASSWORD MATCHING_DB_PASSWORD PAYMENT_DB_PASSWORD \
            NOTIFICATION_DB_PASSWORD RABBITMQ_PASSWORD
          if docker compose --env-file /dev/null \
              -f compose.yaml -f deploy/compose/compose.release.yaml config \
              --quiet > /dev/null 2> release-missing-secrets.log; then
            echo 'release overlay accepted a render without required secrets'
            cat release-missing-secrets.log
            exit 1
          fi
          cat release-missing-secrets.log
          grep -q 'must be set for the release overlay' release-missing-secrets.log
      - name: release overlay requires authentication secrets
        run: |
          # Database/broker passwords are present in this job's environment;
          # disabling the .env file leaves only the authentication secrets absent.
          if docker compose --env-file /dev/null \
              -f compose.yaml -f deploy/compose/compose.release.yaml config \
              --quiet > /dev/null 2> release-missing-auth.log; then
            echo 'release overlay accepted a render without authentication secrets'
            cat release-missing-auth.log
            exit 1
          fi
          cat release-missing-auth.log
          grep -q 'AUTH_.*must be set for the release overlay' release-missing-auth.log
      - run: docker compose -f compose.yaml -f deploy/compose/compose.ha.yaml --profile ha config --quiet
      - run: python3 scripts/security/scan-secrets.py
  platform-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: ride-ci-${{ github.run_id }}-${{ github.run_attempt }}
      TRIP_MESSAGING_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.100
      - run: python3 scripts/security/init-local-auth.py
      - run: docker compose --profile obs up -d --build
      - run: python3 scripts/test/platform-smoke.py
      - run: python3 scripts/test/security-gate.py --identity-tests
      - run: dotnet build scripts/test/core-lifecycle-harness/RideHailing.CoreLifecycleHarness.csproj -c Release
      - run: python3 scripts/test/core-runtime-gate.py
      - run: python3 scripts/evidence/runtime-observations.py --output plans/reports/runtime-observations.json
      - run: python3 scripts/test/payment-smoke.py
      - run: python3 scripts/test/topology-smoke.py
      - if: always()
        run: docker compose --profile obs logs --no-color > platform-smoke.log
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: platform-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            platform-smoke.log
            plans/reports/security-gate.json
            plans/reports/identity-gate.log
            TestResults/core-runtime-gate.json
            plans/reports/runtime-observations.json
            TestResults/identity-gate/
      - if: always()
        run: docker compose --profile obs down -v
  release-smoke:
    name: release-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: ride-release-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.100
      - run: dotnet tool restore
      - name: Production release overlay runtime smoke
        run: python3 scripts/test/release-smoke.py
      - name: Payment decline at the real provider boundary
        run: |
          dotnet test tests/Integration/RideHailing.PaymentService.IntegrationTests -c Release \
            --logger trx --results-directory TestResults/release-payment
          python3 scripts/test/assert-trx.py --results-dir TestResults/release-payment \
            --min-passed 1 --min-files 1 --max-skipped 0 \
            --require-suite ridehailing.paymentservice.integrationtests:1
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            plans/reports/release-smoke.json
            plans/reports/release-smoke.log
            TestResults/release-payment/
      - if: always()
        run: docker compose -f compose.yaml -f deploy/compose/compose.release.yaml down -v
