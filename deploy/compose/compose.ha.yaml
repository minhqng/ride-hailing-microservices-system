# Additive local HA test topology. Always combine with the root compose file:
# docker compose -f compose.yaml -f deploy/compose/compose.ha.yaml --profile ha up -d
services:
  rabbitmq:
    hostname: rabbitmq
    environment:
      RABBITMQ_NODENAME: rabbit@rabbitmq
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-ride_local_cookie_change_me}

  rabbitmq-2:
    image: rabbitmq:4.3.6-management
    profiles: [ha]
    hostname: rabbitmq-2
    environment:
      RABBITMQ_NODENAME: rabbit@rabbitmq-2
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-ride_local_cookie_change_me}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ride_app}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-ride_dev_pw}
    command: ["sh", "/etc/rabbitmq/join-cluster.sh", "rabbit@rabbitmq"]
    volumes:
      - rabbitdata2:/var/lib/rabbitmq
      - ./deploy/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./deploy/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./deploy/rabbitmq/join-cluster.sh:/etc/rabbitmq/join-cluster.sh:ro
    ports:
      - "127.0.0.1:25672:15672"
      - "127.0.0.1:25692:15692"
    depends_on:
      rabbitmq: { condition: service_started }
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [ride-net]

  rabbitmq-3:
    image: rabbitmq:4.3.6-management
    profiles: [ha]
    hostname: rabbitmq-3
    environment:
      RABBITMQ_NODENAME: rabbit@rabbitmq-3
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-ride_local_cookie_change_me}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ride_app}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-ride_dev_pw}
    command: ["sh", "/etc/rabbitmq/join-cluster.sh", "rabbit@rabbitmq"]
    volumes:
      - rabbitdata3:/var/lib/rabbitmq
      - ./deploy/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./deploy/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./deploy/rabbitmq/join-cluster.sh:/etc/rabbitmq/join-cluster.sh:ro
    ports:
      - "127.0.0.1:35672:15672"
      - "127.0.0.1:35692:15692"
    depends_on:
      rabbitmq: { condition: service_started }
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [ride-net]

  driver:
    environment:
      RabbitMq__Hosts: rabbitmq,rabbitmq-2,rabbitmq-3
  trip:
    environment:
      RabbitMq__Hosts: rabbitmq,rabbitmq-2,rabbitmq-3
  matching:
    environment:
      RabbitMq__Hosts: rabbitmq,rabbitmq-2,rabbitmq-3
  payment:
    environment:
      RabbitMq__Hosts: rabbitmq,rabbitmq-2,rabbitmq-3
  notification:
    environment:
      RabbitMq__Hosts: rabbitmq,rabbitmq-2,rabbitmq-3
  prometheus:
    volumes:
      - ./deploy/prometheus/prometheus-ha.yml:/etc/prometheus/prometheus.yml:ro

volumes:
  rabbitdata2:
  rabbitdata3:
